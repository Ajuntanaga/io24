name: package-and-docs

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install --upgrade pip setuptools wheel '.[test]'
      - name: Verify the release package
        run: python -m pytest -q tests/test_io24_release_package.py

  hardware-free:
    name: Hardware-free
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the documented GTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3-gi python3-gi-cairo python3-venv \
            gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Install project and test tools
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel '.[test]'
      - name: Run hardware-free release suite
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_io24_fx_model_transition.py
          tests/test_io24_host_autogain.py
          tests/test_io24_host_delay_action.py
          tests/test_io24_host_parameter_repairs.py
          tests/test_io24_host_rate_and_effects.py
          tests/test_io24_host_resume.py
          tests/test_io24_host_state_repair.py
          tests/test_io24_global_fx.py
          tests/test_io24_scene.py
          tests/test_io24_uc_parity_closure.py
          tests/test_io24_standard_eq_ui.py
          tests/test_io24_vintage_eq_view.py
          tests/test_io24_multiband_insert.py
          tests/test_io24_native_stat.py
          tests/test_io24_preset_persistence.py
          tests/test_io24_presets_page.py
          tests/test_io24_voicefx_delay.py
          tests/test_io24_voicefx_preset_apply.py
          tests/test_android_probe_contract.py
          tests/test_publication_docs.py
          tests/test_io24_release_package.py

  android:
    name: Android
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install the pinned Android SDK packages
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-35" "build-tools;35.0.0"
      - name: Verify the Android controller
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
